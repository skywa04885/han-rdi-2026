name: Publish PDF

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p public

      - name: Install Eisvogel template
        run: |
          mkdir -p ~/.local/share/pandoc/templates
          curl -L \
            https://github.com/Wandmalfarbe/pandoc-latex-template/releases/latest/download/Eisvogel.tar.gz \
            -o eisvogel.tar.gz
          tar -xzf eisvogel.tar.gz
          find . -name "eisvogel.latex" -exec cp {} ~/.local/share/pandoc/templates/eisvogel.latex \;

      - name: Create block image filter
        run: |
          cat << 'EOF' > block-images.lua
          function Para(el)
            if #el.content == 1 and el.content[1].t == "Image" then
              el.content[1].attributes["placement"] = "H"
              return el
            end

            local blocks = {}
            local current = {}

            for _, inline in ipairs(el.content) do
              if inline.t == "Image" then
                inline.attributes["placement"] = "H"

                if #current > 0 then
                  table.insert(blocks, pandoc.Para(current))
                  current = {}
                end

                table.insert(blocks, pandoc.Para({inline}))
              else
                table.insert(current, inline)
              end
            end

            if #current > 0 then
              table.insert(blocks, pandoc.Para(current))
            end

            if #blocks > 1 then
              return blocks
            end

            return el
          end

          function RawInline(el)
            if el.format:match("html") and el.text:match("<img") then
              return pandoc.RawInline("markdown", "\n\n" .. el.text .. "\n\n")
            end
          end
          EOF

      - name: Render README.md to PDF
        uses: docker://pandoc/extra:3.8
        with:
          args: >
            README.md
            -f markdown+implicit_figures+raw_html
            --template=eisvogel
            --lua-filter=block-images.lua
            --listings
            -V geometry:margin=0.5in
            -V code-block-font-size=\scriptsize
            -V listings-disable-line-numbers=true
            -V titlepage=false
            -V figure-placement=H
            -o public/index.pdf

      - name: Create redirect index.html
        run: |
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=index.pdf">
              <title>Redirecting...</title>
            </head>
            <body>
              <p>If you are not redirected, <a href="index.pdf">click here</a>.</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4