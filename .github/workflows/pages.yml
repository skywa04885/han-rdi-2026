name: Publish PDF

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p public

      - name: Install Eisvogel template
        run: |
          mkdir -p ~/.local/share/pandoc/templates
          curl -L \
            https://github.com/Wandmalfarbe/pandoc-latex-template/releases/latest/download/Eisvogel.tar.gz \
            -o eisvogel.tar.gz
          tar -xzf eisvogel.tar.gz
          find . -name "eisvogel.latex" -exec cp {} ~/.local/share/pandoc/templates/eisvogel.latex \;

      - name: Create image placement filter
        run: |
          cat << 'EOF' > image-placement.lua
          function Image(img)
            img.attributes["placement"] = "H"
            return img
          end
          EOF

      - name: Render README.md to PDF
        uses: docker://pandoc/extra:3.8
        with:
          args: >
            README.md
            -f markdown+implicit_figures
            --template=eisvogel
            --lua-filter=image-placement.lua
            --listings
            -V geometry:margin=0.5in
            -V code-block-font-size=\scriptsize
            -V listings-disable-line-numbers=true
            -V titlepage=false
            -V figure-placement=H
            -o public/index.pdf

      - name: Create redirect index.html
        run: |
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=index.pdf">
              <title>Redirecting...</title>
            </head>
            <body>
              <p>If you are not redirected, <a href="index.pdf">click here</a>.</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4